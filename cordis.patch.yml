# This bundle must follow @softspark/dsh-codex in the profile bundle order.
# DSH replaces a targeted row's complete config rather than deep-merging it, so
# keep the full intended static Codex config here. cwd remains provider-defaulted
# to the DSH process working directory.
#
# inheritSessionPermissions belongs to this row alone. It needs
# @softspark/dsh-codex 1.4.0 or newer, where the sandbox and the approval policy
# are inherited from the DSH session independently of each other. The Claude row
# below carries no such key: dsh-subagent-claude-code declares only
# providerName, env, permissionMode and disposeGraceMs, and schemastery keeps an
# undeclared key instead of rejecting it, so the same line there would be a
# silent no-op that reads like an escalation.
- id: llm-codex
  name: '@softspark/dsh-codex'
  config:
    provider: codex
    command: codex
    sandbox: workspace-write
    approvalPolicy: untrusted
    inheritSessionPermissions: true
    allowApiKeyAuth: false
    experimentalDynamicTools: true
    dynamicToolTimeoutMs: 600000
    requestTimeoutMs: 30000
    turnTimeoutMs: 600000

# Host-plane external providers. Installing the bundle starts no vendor process.
# The standard-derived preset separately decides which delegation tools exist.
- insert:
    - id: subagent-claude-code
      name: '@deepseek-ai/dsh-subagent-claude-code'
      config:
        providerName: claude-code
        permissionMode: dontAsk
        env: {}

    # Official GitHub Copilot CLI ACP server. Authentication remains in the
    # native CLI credential store; this bundle never accepts or forwards tokens.
    - id: subagent-copilot-gemini
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: copilot-gemini
        command: copilot
        args:
          - --acp
          - --stdio
          - --no-auto-update
          - --no-custom-instructions
          - --no-remote
          - --no-remote-export
          - --disable-builtin-mcps
          - --no-ask-user
          - --available-tools=
          - --max-ai-credits=30
          - --model=gemini-3.6-flash
        permission: reject
        env: {}

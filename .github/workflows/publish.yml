name: Publish

on:
  push:
    tags: ['v*']

# Publish only. Every gate ran locally in scripts/release.sh before this tag
# existed; nothing here re-runs them. See kb/procedures/sop-release.md.

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
          scope: '@softspark'
      - name: Tag matches every version surface
        run: node scripts/verify-version-sync.mjs --tag "${GITHUB_REF_NAME}"
      # Configuration and docs only: nothing to install or build.
      - name: Publish public package with provenance
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
